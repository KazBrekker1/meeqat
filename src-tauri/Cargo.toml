[package]
name = "meeqat-app"
version = "4.0.1"
description = "Meeqat App"
authors = [ "KazBrekker1" ]
repository = "https://github.com/KazBrekker1/meeqat"
edition = "2021"
license = "MIT"

[lib]
name = "meeqat_app_lib"
crate-type = [
  "staticlib",
  "cdylib",
  "rlib"
]

[build-dependencies.tauri-build]
version = "2"
features = [ ]

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-os = "2"
tauri-plugin-prayer-service = { path = "./tauri-plugin-prayer-service" }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Pray Together realtime listener (together.rs): the updater's reqwest/rustls, no new crates.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["time"] }

[dependencies.tauri]
version = "2.11.5"
features = [
  "tray-icon",
  "macos-private-api",
  "unstable",
  "image-ico",
  "image-png"
]

# The tray popover is an NSPanel on macOS so it can show over full-screen apps.
[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "2.1"
