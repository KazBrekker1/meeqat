"$schema" = "schemas/schema.json"

# The mock-time commands (set/get/clear-mock-time-offset) are deliberately NOT part
# of the default set: grant them explicitly in a debug-only capability if needed.
[default]
description = "Default permissions for the prayer service plugin"
permissions = [
    "allow-update-prayer-times",
    "allow-check-notification-permission",
    "allow-request-notification-permission",
    "allow-check-battery-optimization",
    "allow-request-battery-optimization-exemption",
    "allow-open-app-settings",
    "allow-install-apk",
]
