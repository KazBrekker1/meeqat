name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      draft:
        description: "Create as draft release"
        required: false
        default: false
        type: boolean

# Prevent concurrent releases
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Jobs that write to the release ask for it themselves.
permissions:
  contents: read

# Job graph:
#   create-release ─┬─ publish-desktop (matrix) ── updater-manifest ─┬─ publish-release
#                   └─ publish-android ──────────────────────────────┘
# The release stays a DRAFT until publish-release, which only runs when every other
# job succeeded. A published release is what `releases/latest` points at, so the
# desktop updater (latest.json) and the Android updater (the APK asset) never see a
# release that is still being built, or one whose build failed.

jobs:
  # Create (or find) the draft release first, so desktop + android can run in parallel
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release_id: ${{ steps.meta.outputs.release_id }}
      draft: ${{ steps.meta.outputs.draft }}
      skip: ${{ steps.meta.outputs.skip }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # release notes are built from the commits since the last tag

      - name: Get version from package.json
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # What's new, for the release page and the in-app update dialog (latest.json notes
      # on desktop, the release body on Android).
      - name: Write release notes
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          scripts/release-notes.sh "meeqat-v${VERSION}" > /tmp/whats_new.md
          cat /tmp/whats_new.md
          {
            echo "notes<<MEEQAT_NOTES_EOF"
            cat /tmp/whats_new.md
            echo "MEEQAT_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure a draft GitHub release exists
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          DRAFT: ${{ github.event.inputs.draft == 'true' }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="meeqat-v${VERSION}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"

          # List the releases instead of asking for the tag: the REST API doesn't
          # return a draft by its tag (a draft has no tag yet).
          gh api --paginate "repos/$REPO/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"" > /tmp/existing.txt
          RELEASE_ID=""
          IS_DRAFT=""
          read -r RELEASE_ID IS_DRAFT < /tmp/existing.txt || true

          if [ -n "$RELEASE_ID" ]; then
            echo "Release $TAG already exists (id $RELEASE_ID, draft: $IS_DRAFT)"
            echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
            # A push that doesn't bump the version must not rebuild and re-upload an
            # existing release. To re-run a failed release, use "Run workflow".
            if [ "$EVENT_NAME" = "push" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Re-running a release that was never published: its tag will be created
            # on publish, and must point at the commit being built now.
            if [ "$IS_DRAFT" = "true" ]; then
              gh api -X PATCH "repos/$REPO/releases/$RELEASE_ID" -f target_commitish="$GITHUB_SHA" --silent
            fi
            exit 0
          fi

          { echo "## What's New"; echo; cat /tmp/whats_new.md; echo; } > /tmp/release_notes.md
          cat >> /tmp/release_notes.md <<'EOF'
          ## Installation

          ### macOS
          After installing, you may need to run: `xattr -c /Applications/Meeqat.app`

          ### Windows
          Download the `.msi` installer for Windows.

          ### Linux
          Download the `.deb` package or `.AppImage`.
          EOF

          # Always a draft here; publish-release publishes it once everything is uploaded
          # (unless "Create as draft release" was ticked).
          RELEASE_ID="$(gh api -X POST "repos/$REPO/releases" \
            -f tag_name="$TAG" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="Meeqat v${VERSION}" \
            -F body=@/tmp/release_notes.md \
            -F draft=true \
            --jq .id)"
          echo "Created draft release $TAG (id $RELEASE_ID)"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  # Build the desktop apps and upload them to the draft release
  publish-desktop:
    needs: create-release
    if: needs.create-release.outputs.skip != 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            arch: arm64
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            arch: x64
          - platform: ubuntu-22.04
            args: ""
            arch: x64
          # Linux ARM64 - only available for public repos
          # - platform: ubuntu-22.04-arm
          #   args: ''
          #   arch: arm64
          - platform: windows-latest
            args: ""
            arch: x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Cache bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch, 2026-10-09
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.platform }}-${{ matrix.arch }}

      - name: Install dependencies (Ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Note: tauri-action runs beforeBuildCommand from tauri.conf.json automatically
      # so we don't need a separate "bun generate" step

      - name: Build and upload
        id: tauri
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip Apple code signing (no certificates configured)
          APPLE_SIGNING_IDENTITY: "-"
          # Updater signing — produces the .sig files the desktop updater verifies.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Upload to the draft by id: the action only finds a release by tag when it
          # is told the release is a draft, and creates a second one otherwise.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # latest.json is written once, by updater-manifest. The action's own copy
          # would point at the draft's temporary download URLs, and the matrix jobs
          # would overwrite each other's.
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  # Android job - runs in parallel with desktop (the draft release is created up front)
  publish-android:
    needs: create-release
    if: needs.create-release.outputs.skip != 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    environment: Main

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Cache bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch, 2026-10-09
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: android-arm64-armv7

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        # v3 defaults to the legacy 'tools' package, which newer sdkmanager
        # builds no longer ship (install fails) — ask for platform-tools only.
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Export Android environment variables
        run: |
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Initialize Android project (if missing)
        run: test -d src-tauri/gen/android || bun run tauri android init

      # Secrets reach the script through the environment only (never interpolated into
      # it), and nothing from keystore.properties is printed.
      - name: Setup Android signing
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_STORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEY_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Android signing secret $name is not set; refusing to build an unsigned release"
              exit 1
            fi
          done

          umask 077
          echo "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          # keystore.properties must be in app/ directory where build.gradle.kts is located
          {
            echo "storeFile=$RUNNER_TEMP/keystore.jks"
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "password=$ANDROID_KEY_PASSWORD"
          } > src-tauri/gen/android/app/keystore.properties
          echo "Wrote keystore.properties"

      # arm64 and 32-bit ARM, matching abiFilters in gen/android/app/build.gradle.kts;
      # the universal APK/AAB carries both.
      - name: Build Android APK + AAB (release)
        run: bun run tauri android build --target aarch64 --target armv7

      - name: List build outputs
        run: |
          echo "=== APK files ==="
          find src-tauri/gen/android -name "*.apk" -exec ls -lh {} \;
          echo "=== AAB files ==="
          find src-tauri/gen/android -name "*.aab" -exec ls -lh {} \;

      - name: Upload Android artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          # The signed universal APK: the one the in-app updater downloads. An unsigned
          # build is named *-unsigned.apk and must never be released.
          mapfile -t APKS < <(find src-tauri/gen/android -path "*/outputs/apk/universal/release/*" -name "*.apk" ! -name "*unsigned*")
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one signed universal release APK, found ${#APKS[@]}"
            exit 1
          fi
          APK="${APKS[0]}"

          # Really signed (fails otherwise), and carrying the native library for both ABIs.
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify "$APK"
          unzip -Z1 "$APK" > /tmp/apk-files.txt
          for abi in arm64-v8a armeabi-v7a; do
            if ! grep -q "^lib/$abi/.*\.so$" /tmp/apk-files.txt; then
              echo "::error::$APK has no native library for $abi"
              exit 1
            fi
          done

          AAB="$(find src-tauri/gen/android -path "*/outputs/bundle/universalRelease/*" -name "*.aab" | head -n 1)"

          echo "Uploading to release $TAG"
          echo "APK: $APK"
          echo "AAB: ${AAB:-none}"

          # gh finds the draft release by its pending tag. A failed upload fails the job.
          gh release upload "$TAG" "$APK" --clobber --repo "$REPO"
          if [ -n "$AAB" ]; then
            gh release upload "$TAG" "$AAB" --clobber --repo "$REPO"
          fi

          echo "Upload complete"

  # Compose a single authoritative latest.json for the desktop updater.
  # Runs after every desktop platform is uploaded, so it never races the matrix jobs.
  updater-manifest:
    needs: [create-release, publish-desktop]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Compose and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.tag }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          VERSION: ${{ needs.create-release.outputs.version }}
          NOTES: ${{ needs.create-release.outputs.notes }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          cd "$WORK"

          # Read the assets endpoint, not `gh release view`: the release object's
          # embedded asset list lags behind uploads and came back empty for v3.4.0.
          # By release id, because the release is still a draft (no tag to look up).
          gh api --paginate "repos/$REPO/releases/$RELEASE_ID/assets?per_page=100" \
            --jq '.[] | "\(.id)\t\(.name)"' > assets.tsv
          ASSETS="$(cut -f2 assets.tsv)"
          # Where the files will be once the release is published.
          BASE_URL="https://github.com/$REPO/releases/download/$TAG"

          # Tauri updater target -> filename suffix of its updater artifact.
          declare -A PATTERNS=(
            ["darwin-aarch64"]="aarch64.app.tar.gz"
            ["darwin-x86_64"]="x64.app.tar.gz"
            ["linux-x86_64"]="amd64.AppImage"
            ["windows-x86_64"]="x64-setup.exe"
          )

          # Every platform is required: a manifest without one would leave that
          # platform's users on the old version without anyone noticing.
          PLATFORMS="{}"
          for TARGET in "${!PATTERNS[@]}"; do
            SUFFIX="${PATTERNS[$TARGET]}"
            ESC="$(printf '%s' "$SUFFIX" | sed 's/\./\\./g')"
            ART="$(printf '%s\n' "$ASSETS" | grep -E "${ESC}$" | head -n 1 || true)"
            if [ -z "$ART" ]; then
              echo "::error::no updater artifact for $TARGET (*$SUFFIX)"; exit 1
            fi
            SIG_NAME="${ART}.sig"
            SIG_ID="$(awk -F'\t' -v n="$SIG_NAME" '$2 == n { print $1; exit }' assets.tsv)"
            if [ -z "$SIG_ID" ]; then
              echo "::error::missing signature $SIG_NAME for $TARGET"; exit 1
            fi
            # A draft's assets have no public URL yet: download through the API.
            SIG="$(gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$SIG_ID")"
            if [ -z "$SIG" ]; then
              echo "::error::empty signature $SIG_NAME for $TARGET"; exit 1
            fi
            URL="$BASE_URL/$ART"
            PLATFORMS="$(printf '%s' "$PLATFORMS" | jq \
              --arg t "$TARGET" --arg s "$SIG" --arg u "$URL" \
              '. + {($t): {signature:$s, url:$u}}')"
          done

          COUNT="$(printf '%s' "$PLATFORMS" | jq 'length')"

          jq -n \
            --arg v "$VERSION" \
            --arg notes "${NOTES:-See https://github.com/$REPO/releases/tag/$TAG}" \
            --argjson p "$PLATFORMS" \
            '{version:$v, notes:$notes, pub_date:(now|todate), platforms:$p}' > latest.json

          echo "=== latest.json ($COUNT platforms) ==="
          cat latest.json
          # --clobber finds the old asset through the same lagging list, so delete by id.
          OLD_ID="$(awk -F'\t' '$2 == "latest.json" { print $1; exit }' assets.tsv)"
          if [ -n "$OLD_ID" ]; then
            gh api -X DELETE "repos/$REPO/releases/assets/$OLD_ID"
          fi
          gh release upload "$TAG" latest.json --repo "$REPO"

  # Last: publish the draft, once desktop, Android and latest.json are all in place.
  # If any job above failed this is skipped and the release stays a draft — nothing
  # is offered to users. Fix the problem and use "Run workflow" to build again.
  publish-release:
    needs: [create-release, publish-desktop, publish-android, updater-manifest]
    if: needs.create-release.outputs.skip != 'true' && needs.create-release.outputs.draft != 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.tag }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          VERSION: ${{ needs.create-release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          # What the in-app updaters need must be there before anyone can see the release.
          ASSETS="$(gh api --paginate "repos/$REPO/releases/$RELEASE_ID/assets?per_page=100" --jq '.[].name')"
          if ! printf '%s\n' "$ASSETS" | grep -qxF "latest.json"; then
            echo "::error::latest.json is missing from the release"; exit 1
          fi
          if ! printf '%s\n' "$ASSETS" | grep -E '\.apk$' | grep -qv unsigned; then
            echo "::error::no signed APK on the release"; exit 1
          fi

          if [ "$(gh api "repos/$REPO/releases/$RELEASE_ID" --jq .draft)" != "true" ]; then
            echo "Release $TAG is already published (assets were re-uploaded); nothing to publish."
            exit 0
          fi

          gh api -X PATCH "repos/$REPO/releases/$RELEASE_ID" -F draft=false -f make_latest=true --silent
          echo "Published $TAG"

          # The URL the desktop updater polls must now serve this version.
          for attempt in 1 2 3 4 5 6; do
            SERVED="$(curl -fsSL "https://github.com/$REPO/releases/latest/download/latest.json" | jq -r .version || true)"
            if [ "$SERVED" = "$VERSION" ]; then
              echo "releases/latest/download/latest.json serves $VERSION"
              exit 0
            fi
            echo "latest.json serves '${SERVED:-nothing}' (attempt $attempt), retrying..."
            sleep 10
          done
          echo "::error::releases/latest/download/latest.json does not serve $VERSION after publishing"
          exit 1

  # Optional: Build iOS (requires macOS runner and Apple Developer account)
  # publish-ios:
  #   needs: publish-desktop
  #   permissions:
  #     contents: write
  #   runs-on: macos-latest
  #   environment: Main
  #   steps:
  #     - uses: actions/checkout@v4
  #     # ... iOS build steps ...
